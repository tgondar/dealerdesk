name: CI

# Every push to every branch. A pull request shows these results too, because
# they attach to the commit.
on: push

permissions:
  contents: read

jobs:
  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the rollback check builds release 2.3 from history

      - name: Build, warnings are errors
        run: make CFLAGS="-std=c89 -pedantic -Wall -Wextra -Werror"

      - name: Pricing unit tests and recorded sessions
        run: make test

      - name: Recorded sessions under ASan and UBSan
        run: make test-asan

      - name: Data survives a rollback to release 2.3
        run: make test-rollback

      - name: README Quick Start build behaves the same
        run: |
          gcc -o /tmp/dealerdesk-quickstart *.c -lm
          BIN=/tmp/dealerdesk-quickstart bash tests/run.sh
